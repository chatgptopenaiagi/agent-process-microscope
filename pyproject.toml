[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-process-microscope"
version = "0.1.0"
description = "Scoped external agent observation, durable evidence and passive replay"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = ["psutil>=7,<9"]

[project.urls]
Repository = "https://github.com/chatgptopenaiagi/agent-process-microscope"
Issues = "https://github.com/chatgptopenaiagi/agent-process-microscope/issues"

[project.scripts]
apm = "apm.__main__:main"

[project.gui-scripts]
apm-gui = "apm.ui.main_window:run_gui"

[tool.setuptools.packages.find]
include = ["apm*"]
